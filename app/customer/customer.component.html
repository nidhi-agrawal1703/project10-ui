<app-navbar></app-navbar>
<div align="center">
     <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Customer</h1>
    <h1 *ngIf="form.data.id" align="center" style="margin-bottom: 5px; color: navy">Update Customer</h1>

     <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{form.message}}</h3>
        <h3 style="margin: 0; color:red;" *ngIf="form.error && form.message">{{form.message}}</h3>
    </div>

    <table>
        <tr>
            <th align="left">Customer Name</th>
            <td align="center"><input type="text" name="name" [(ngModel)]="form.data.name" placeholder="Enter Customer Name"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.name}}</td>
        </tr>

         <tr>
            <th align="left">Email</th>
            <td align="center"><input type="text" name="email" [(ngModel)]="form.data.email" placeholder="Enter Email"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.email}}</td>
        </tr>

        <tr>
            <th align="left">Phone Number</th>
            <td align="center"><input type="text" name="phoneNumber" [(ngModel)]="form.data.phoneNumber" placeholder="Enter Phone Number"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.phoneNumber}}</td>
        </tr>

         <tr>
            <th align="left">Address</th>
            <td align="center"><input type="text" name="address" [(ngModel)]="form.data.address" placeholder="Enter Address"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.address}}</td>
        </tr>

         
        <tr>
            <th></th>
            <td align="left" colspan="2">
                 <button (click)="submit()">save</button> &nbsp;
                 <button (click)="forward('/customerlist')">list</button>
            </td>
        </tr>

    </table>
</div>
<app-footer></app-footer>
