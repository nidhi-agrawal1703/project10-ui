<app-navbar></app-navbar>

<div class="inquiry-card">
  <div class="inquiry-card-header">
    <h1>Change Password</h1>
  </div>

  <div class="inquiry-status" [ngClass]="{ 'success': !form.error && form.message, 'error': form.error && form.message }" *ngIf="form.message">
    {{form.message}}
  </div>

  <div class="inquiry-form-body">
    <div class="inquiry-form-grid">
      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-lock"></i>Old Password</label>
        <input class="inquiry-input" type="password" name="oldPassword" [(ngModel)]="form.data.oldPassword" placeholder="Enter Old Password">
        <div class="error-text">{{ form.inputerror.oldPassword }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-key"></i>New Password</label>
        <input class="inquiry-input" type="password" name="newPassword" [(ngModel)]="form.data.newPassword" placeholder="Enter New Password">
        <div class="error-text">{{ form.inputerror.newPassword }}</div>
      </div>

      <div class="inquiry-actions">
        <button class="btn btn-primary" (click)="changePassword()"><i class="fa fa-key mr-2"></i>Change Password</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
