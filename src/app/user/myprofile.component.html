<app-navbar></app-navbar>

<div class="inquiry-card">
  <div class="inquiry-card-header">
    <h1>My Profile</h1>
  </div>

  <div class="inquiry-status" [ngClass]="{ 'success': !form.error && form.message, 'error': form.error && form.message }" *ngIf="form.message">
    {{form.message}}
  </div>

  <div class="inquiry-form-body">
    <div class="inquiry-form-grid">
      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-user"></i>First Name</label>
        <input class="inquiry-input" type="text" name="firstName" [(ngModel)]="form.data.firstName" placeholder="Enter First Name">
        <div class="error-text">{{ form.inputerror.firstName }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-user"></i>Last Name</label>
        <input class="inquiry-input" type="text" name="lastName" [(ngModel)]="form.data.lastName" placeholder="Enter Last Name">
        <div class="error-text">{{ form.inputerror.lastName }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-id-badge"></i>Login Id</label>
        <input class="inquiry-input" type="text" name="loginId" [(ngModel)]="form.data.loginId" placeholder="Enter Login Id">
        <div class="error-text">{{ form.inputerror.loginId }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-calendar"></i>Date of Birth</label>
        <input class="inquiry-input" type="date" name="dob" [(ngModel)]="form.data.dob" [ngModel]="form.data.dob | date:'yyyy-MM-dd'">
        <div class="error-text">{{ form.inputerror.dob }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-venus-mars"></i>Gender</label>
        <select class="inquiry-input" name="gender" [(ngModel)]="form.data.gender">
          <option value="undefined">--------Select--------</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
        <div class="error-text">{{ form.inputerror.gender }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-mobile-alt"></i>Phone</label>
        <input class="inquiry-input" type="text" name="phone" [(ngModel)]="form.data.phone" placeholder="Enter Phone No">
        <div class="error-text">{{ form.inputerror.phone }}</div>
      </div>

      <div class="inquiry-actions">
        <button class="btn btn-primary" (click)="myProfile()"><i class="fa fa-save mr-2"></i>Save</button>
        <button class="btn btn-secondary" (click)="forward('/userlist')"><i class="fa fa-list mr-2"></i>List</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
