<app-navbar></app-navbar>

<div class="inquiry-card">
  <div class="inquiry-card-header">
    <h1 *ngIf="!form.data.id">Add Course</h1>
    <h1 *ngIf="form.data.id">Update Course</h1>
  </div>

  <div class="inquiry-status" [ngClass]="{ 'success': !form.error && form.message, 'error': form.error && form.message }" *ngIf="form.message">
    {{form.message}}
  </div>

  <div class="inquiry-form-body">
    <div class="inquiry-form-grid">
      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-book"></i>Name</label>
        <input class="inquiry-input" type="text" name="name" [(ngModel)]="form.data.name" placeholder="Enter Name">
        <div class="error-text">{{ form.inputerror.name }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-clock"></i>Duration</label>
        <input class="inquiry-input" type="text" name="duration" [(ngModel)]="form.data.duration" placeholder="Enter Duration">
        <div class="error-text">{{ form.inputerror.duration }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-align-left"></i>Description</label>
        <input class="inquiry-input" type="text" name="description" [(ngModel)]="form.data.description" placeholder="Enter Description">
        <div class="error-text">{{ form.inputerror.description }}</div>
      </div>

      <div class="inquiry-actions">
        <button class="btn btn-primary" (click)="submit()"><i class="fa fa-save mr-2"></i>Save</button>
        <button class="btn btn-secondary" (click)="forward('/courselist')"><i class="fa fa-list mr-2"></i>List</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
