<app-navbar></app-navbar>
<div align="center">
     <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Parking</h1>
    <h1 *ngIf="form.data.id" align="center" style="margin-bottom: 5px; color: navy">Update Parking</h1>

     <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{form.message}}</h3>
        <h3 style="margin: 0; color:red;" *ngIf="form.error && form.message">{{form.message}}</h3>
    </div>

    <table>
        <tr>
            <th align="left">Branch Name</th>
            <td align="center"><input type="text" name="branchName" [(ngModel)]="form.data.branchName" placeholder="Enter Branch Name"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.branchName}}</td>
        </tr>

         <tr>
            <th align="left">City</th>
            <td align="center"><input type="text" name="city" [(ngModel)]="form.data.city" placeholder="Enter City"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.city}}</td>
        </tr>

        <tr>
            <th align="left">Manager Name</th>
            <td align="center"><input type="text" name="managerName" [(ngModel)]="form.data.managerName" placeholder="Enter Manager Name"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.managerName}}</td>
        </tr>

         <tr>
            <th align="left">Contact No</th>
            <td align="center"><input type="text" name="contactNo" [(ngModel)]="form.data.contactNo" placeholder="Enter Contact No"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.contactNo}}</td>
        </tr>

         
        <tr>
            <th></th>
            <td align="left" colspan="2">
                 <button (click)="submit()">save</button> &nbsp;
                 <button (click)="forward('/branchlist')">list</button>
            </td>
        </tr>

    </table>
</div>
<app-footer></app-footer>
