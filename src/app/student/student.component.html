<app-navbar></app-navbar>

<div class="inquiry-card inquiry-scroll-card">
  <div class="inquiry-card-header">
    <h1 *ngIf="!form.data.id">Add Student</h1>
    <h1 *ngIf="form.data.id">Update Student</h1>
  </div>

  <div class="inquiry-status" [ngClass]="{ 'success': !form.error && form.message, 'error': form.error && form.message }" *ngIf="form.message">
    {{form.message}}
  </div>

  <div class="inquiry-form-body">
    <div class="inquiry-form-grid">
      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-id-card"></i>Enrolment No</label>
        <input class="inquiry-input" type="text" name="enrolNo" [(ngModel)]="form.data.enrolNo" placeholder="Enter Enrolment Number">
        <div class="error-text">{{ form.inputerror.enrolNo }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-user"></i>First Name</label>
        <input class="inquiry-input" type="text" name="firstName" [(ngModel)]="form.data.firstName" placeholder="Enter First Name">
        <div class="error-text">{{ form.inputerror.firstName }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-user"></i>Last Name</label>
        <input class="inquiry-input" type="text" name="lastName" [(ngModel)]="form.data.lastName" placeholder="Enter Last Name">
        <div class="error-text">{{ form.inputerror.lastName }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-calendar"></i>Date of Birth</label>
        <input class="inquiry-input" type="date" name="dob" [(ngModel)]="form.data.dob" placeholder="Enter DOB">
        <div class="error-text">{{ form.inputerror.dob }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-mobile-alt"></i>Phone No.</label>
        <input class="inquiry-input" type="text" name="phoneNo" [(ngModel)]="form.data.phoneNo" placeholder="Enter Phone Number">
        <div class="error-text">{{ form.inputerror.phoneNo }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-envelope"></i>Email</label>
        <input class="inquiry-input" type="text" name="email" [(ngModel)]="form.data.email" placeholder="Enter Email">
        <div class="error-text">{{ form.inputerror.email }}</div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-label"><i class="fa fa-university"></i>College</label>
        <select class="inquiry-input" name="collegeId" [(ngModel)]="form.data.collegeId">
          <option value="undefined">------------Select------------</option>
          <option *ngFor="let obj of form.preload.collegeList" [value]="obj.key">{{obj.value}}</option>
        </select>
        <div class="error-text">{{ form.inputerror.collegeId }}</div>
      </div>

      <div class="inquiry-actions">
        <button class="btn btn-primary" (click)="submit()"><i class="fa fa-save mr-2"></i>Save</button>
        <button class="btn btn-secondary" (click)="forward('/studentlist')"><i class="fa fa-list mr-2"></i>List</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
