<app-navbar></app-navbar>

<div class="inquiry-list-card batch-list-card">
  <div class="inquiry-list-header">
    <h1>Batch List</h1>
  </div>

  <div class="inquiry-list-status" [ngClass]="{ 'success': !form.error && form.message, 'error': form.error && form.message }" *ngIf="form.message">
    {{form.message}}
  </div>

  <div class="inquiry-list-body">
    <div *ngIf="form.list.length > 0">
      <div class="batch-search-card">
        <div class="batch-search-row">
          <label class="batch-search-label"><b>Batch Code</b></label>
          <input class="inquiry-input" type="text" name="batchCode" [(ngModel)]="form.searchParams.batchCode" placeholder="Enter Batch Code">

          <label class="batch-search-label"><b>Batch Name</b></label>
          <input class="inquiry-input" type="text" name="batchName" [(ngModel)]="form.searchParams.batchName" placeholder="Enter Batch Name">
            
          <button class="btn btn-primary btn-sm" (click)="search()">Search</button>
          <button class="btn btn-secondary btn-sm" (click)="reset()">Reset</button>
        </div>
      </div>

      <table class="inquiry-grid-table batch-grid-table">
        <tr>
          <th><input type="checkbox" [(ngModel)]="isMasterSel" (change)="checkUncheckAll($event)"></th>
          <th>S.No.</th>
          <th>Batch Code</th>
          <th>Batch Name</th>
          <th>Trainer Name</th>
          <th>Batch Timing</th>
          <th>Edit</th>
        </tr>

        <tr *ngFor="let m of form.list; let i=index">
          <td><input type="checkbox" #checkboxes (change)="checkListUpdate()" [id]="m.id" [value]="isMasterSel"></td>
          <td>{{(form.pageNo*5)+i+1}}</td>
          <td>{{m.batchCode}}</td>
          <td>{{m.batchName}}</td>
          <td>{{m.trainerName}}</td>
          <td>{{m.batchTiming}}</td>
          <td><a class="edit-link" (click)="forward('/batch/'+m.id)">Edit</a></td>
        </tr>
      </table>

      <div class="inquiry-list-actions">
        <button class="btn btn-secondary" (click)="previous()" [disabled]="form.pageNo == 0">Previous</button>
        <button class="btn btn-primary" (click)="forward('/batch')">New</button>
        <button class="btn btn-danger" (click)="deleteMany()">Delete</button>
        <button class="btn btn-secondary" (click)="next()" [disabled]="form.nextListSize == 0">Next</button>
      </div>
    </div>

    <div *ngIf="form.list.length == 0" class="empty-state">
      <button class="btn btn-primary" (click)="reset()">Back</button>
    </div>
  </div>
</div>

<app-footer></app-footer>
